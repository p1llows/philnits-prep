services:
  web:
    image: nginx:alpine
    container_name: philnits_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - philnits-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: philnits_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - philnits-network
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    container_name: philnits_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-philnits_prep}
      MYSQL_USER: ${DB_USERNAME:-philnits}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/etc/mysql/conf.d/init.sql
    networks:
      - philnits-network
    ports:
      - "3307:3306"

  redis:
    image: redis:alpine
    container_name: philnits_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - philnits-network

networks:
  philnits-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
